<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Cert 랜덤 퀴즈</title><style>
:root{--g:#20b876;--g2:#0e9660;--soft:#effbf5;--text:#172033;--muted:#788596;--line:#e6efeb;--blue:#5a96f6;--peach:#fff2e7}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f7fbf9;color:var(--text)}button,select{font:inherit}.app{max-width:1280px;margin:auto;padding:18px;display:grid;grid-template-columns:190px 1fr;gap:18px}.side{background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;min-height:calc(100vh - 36px);display:flex;flex-direction:column;box-shadow:0 12px 32px #244a3910}.brand{font-size:22px;font-weight:900;margin:8px 4px 20px;color:#111}.brand b{color:var(--g)}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:16px;font-weight:800;color:#59687b;cursor:pointer}.nav button.active{background:#eaf9f1;color:var(--g2)}.quote{margin-top:auto;background:var(--soft);padding:16px;border-radius:18px;color:#607366;line-height:1.55}.main{min-width:0}.hero{height:280px;border-radius:28px;overflow:hidden;background:#eafbf4 url('hero.svg') center/cover no-repeat;border:1px solid #dcf0e4}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 28px #244a390d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border-radius:20px;padding:18px;background:#eef6ff}.stat:nth-child(2){background:#fff3e9}.stat:nth-child(3){background:#edfbf3}.label{color:#506073;font-weight:800}.big{font-size:46px;font-weight:950;margin-top:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.action{height:64px;border-radius:17px;border:1px solid var(--line);background:#fff;font-weight:900;cursor:pointer}.action.primary{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}.progressarea{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),#edf1f0 0);display:grid;place-items:center;margin:12px auto;position:relative}.ring:before{content:"";width:112px;height:112px;background:#fff;border-radius:50%}.ring b{position:absolute;font-size:38px}.row{margin:18px 0}.bar{height:12px;background:#edf1f2;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--g);border-radius:99px}.bar.blue>div{background:var(--blue)}.barhead{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px}.view{display:none}.view.active{display:block}.quizgrid{display:grid;grid-template-columns:280px 1fr;gap:16px}.control{margin-bottom:11px}.control label{display:block;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:6px}.control select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 12px}.qstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qstat{padding:12px;background:#f7faf8;border-radius:14px}.qstat b{display:block;font-size:24px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:12px;font-weight:800;padding:6px 9px;border-radius:99px;background:#edf9f3;color:#238a60}.chip.gray{background:#f1f3f5;color:#6b7684}.type{background:linear-gradient(135deg,#eaf9ff,#f0fff5);padding:13px;border-radius:14px;font-weight:900;margin-bottom:14px;color:#316c69}.question{font-size:28px;line-height:1.4;font-weight:950;margin:10px 0 18px}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;font-size:16px;cursor:pointer;display:flex;gap:10px}.choice .num{width:30px;height:30px;border-radius:9px;background:#edf8f2;color:var(--g2);font-weight:900;display:grid;place-items:center;flex:none}.choice.correct{background:#edfbf3;border-color:#91d3ad}.choice.wrong{background:#fff2ea;border-color:#efb68e}.choice.dim{opacity:.5}.feedback{display:none;margin-top:14px;padding:15px;border-radius:15px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#edfbf3}.feedback.bad{background:#fff3ea}.qactions{display:flex;gap:10px;margin-top:14px}.btn{height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:900;padding:0 16px;cursor:pointer}.btn.primary{background:var(--g2);color:#fff;border:0;flex:1}.wrongitem{border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.mobilebar{display:none}
@media(max-width:800px){body{padding-bottom:72px}.app{display:block;padding:10px}.side{display:none}.hero{height:220px;border-radius:22px;background-position:center}.grid,.quizgrid,.progressarea{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:12px}.label{font-size:12px}.big{font-size:28px}.actions{grid-template-columns:1fr}.action{height:56px}.question{font-size:21px}.choice{padding:14px;font-size:15px}.mobilebar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.mobilebar button{height:62px;border:0;background:#fff;font-size:11px;font-weight:800;color:#617083}.mobilebar button b{display:block;font-size:20px;margin-bottom:2px}.mobilebar button.active{color:var(--g2);background:#f0fbf5}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>AI</b> Cert</div><div class="nav"><button class="navbtn active" data-v="dash">🏠 대시보드</button><button class="navbtn" data-v="quiz">📝 문제 풀이</button><button class="navbtn" data-v="wrong">📖 오답 노트</button><button class="navbtn" data-exam="1">🎓 모의고사</button></div><div class="quote">🌱 작은 반복이 큰 변화를 만듭니다.<br><b>오늘도 화이팅!</b></div></aside><main class="main">
<section id="v-dash" class="view active"><div class="hero"></div><div class="grid"><div class="card"><div class="stats"><div class="stat"><div class="label">전체 문제수</div><div class="big" id="total">195</div></div><div class="stat"><div class="label">오늘 학습</div><div class="big" id="today">0</div></div><div class="stat"><div class="label">정답률</div><div class="big" id="allrate">0%</div></div></div><div class="actions"><button class="action primary" id="randomStart">▶ 랜덤 문제 시작</button><button class="action" id="wrongStart">☰ 오답 복습</button><button class="action" id="examStart">🎓 모의고사 시작</button></div></div><div class="card progressarea"><div><h3>학습 목표 달성률</h3><div class="ring" id="ring"><b id="goal">0%</b></div><div style="text-align:center;color:#708071">100문제 학습 목표</div></div><div><h3>영역별 학습 진도</h3><div class="row"><div class="barhead"><span>AI 리터러시와 업무 활용</span><span id="aip">0%</span></div><div class="bar"><div id="aibar"></div></div></div><div class="row"><div class="barhead"><span>데이터 리터러시</span><span id="datap">0%</span></div><div class="bar blue"><div id="databar"></div></div></div></div></div></div></section>
<section id="v-quiz" class="view"><div class="quizgrid"><div class="card"><h3>학습 설정</h3><div class="control"><label>시험 분야</label><select id="domain"><option value="all">전체 통합</option><option value="ai">AI 리터러시와 업무 활용</option><option value="data">데이터 리터러시</option><option value="tutorial">AI 챔피언 튜토리얼</option></select></div><div class="control"><label>난이도</label><select id="level"><option value="all">전체 혼합</option><option value="common">공통·기초</option><option value="green">그린</option><option value="blue">블루</option></select></div><div class="control"><label>문제 유형</label><select id="qtype"><option value="mixed">실전 혼합</option><option value="ox">O/X 판단형</option><option value="mcq">4지선다형</option></select></div><div class="control"><label>출제 방식</label><select id="mode"><option value="weighted">오답 가중 랜덤</option><option value="pure">완전 랜덤</option><option value="wrong">틀린 문제 집중</option></select></div><div class="control"><label>학습 단위</label><select id="size"><option value="0">무한 학습</option><option value="10">10문제</option><option value="20">20문제</option></select></div><div class="qstats"><div class="qstat"><b id="solved">0</b><span>풀이</span></div><div class="qstat"><b id="correct">0</b><span>정답</span></div><div class="qstat"><b id="wrong">0</b><span>오답</span></div><div class="qstat"><b id="rate">0%</b><span>정답률</span></div></div></div><div class="card"><div id="quizArea"><div class="type" id="type">문제 준비 중</div><div class="chips"><span class="chip" id="lvtag"></span><span class="chip" id="cattag"></span><span class="chip gray" id="srctag"></span></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"><b id="result"></b><div id="explain"></div></div><div class="qactions"><button class="btn" id="skip">다른 문제</button><button class="btn primary" id="next" style="display:none">다음 문제 →</button></div></div><div id="done" style="display:none;text-align:center;padding:30px"><h2>세션 완료 🎉</h2><p id="doneText"></p><button class="btn primary" id="again">다시 시작</button></div></div></div></section>
<section id="v-wrong" class="view"><div class="card"><h2>오답 노트</h2><p style="color:var(--muted)">틀린 문제를 다시 확인하고 반복 학습하세요.</p><div id="wrongList"></div></div></section>
</main></div><div class="mobilebar"><button data-v="dash" class="active"><b>🏠</b>홈</button><button data-v="quiz"><b>📝</b>문제</button><button data-v="wrong"><b>📖</b>오답</button><button data-exam="1"><b>🎓</b>모의</button></div>
<script>window.BANK=[];</script><script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script src="q5.js"></script><script src="q6.js"></script><script src="q7.js"></script><script src="q8.js"></script><script>
BANK.forEach(q=>{if(!q.domain)q.domain='tutorial';if(!q.src)q.src='AI 챔피언 튜토리얼';if(!q.type)q.type=q.c&&q.c.length===2?'ox':'mcq'});const $=x=>document.getElementById(x);let cur=null,answered=false,recent=[],sess={s:0,c:0,w:0};const hist=JSON.parse(localStorage.getItem('aicert_hist')||'{}'),daily=JSON.parse(localStorage.getItem('aicert_daily')||'{}');function key(){let d=new Date();return d.toISOString().slice(0,10)}function save(){localStorage.setItem('aicert_hist',JSON.stringify(hist));localStorage.setItem('aicert_daily',JSON.stringify(daily))}function pool(){let d=$('domain').value,l=$('level').value,t=$('qtype').value;return BANK.filter(q=>(d==='all'||q.domain===d)&&(l==='all'||q.level===l)&&(t==='mixed'||q.type===t))}function wt(q){let h=hist[q.id]||{ok:0,bad:0};if($('mode').value==='pure')return 1;if($('mode').value==='wrong')return h.bad?Math.max(2,h.bad*3-h.ok):.03;return 1+h.bad*2.5-Math.min(h.ok,3)*.2}function pick(){let p=pool().filter(q=>!recent.includes(q.id));if(!p.length)p=pool();if(!p.length)return null;let ws=p.map(q=>Math.max(.03,wt(q))),r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0)return p[i]}return p[0]}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('v-'+v).classList.add('active');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='wrong')renderWrong();if(v==='dash')dashboard()}function render(){answered=false;$('feedback').className='feedback';$('next').style.display='none';$('skip').style.display='block';cur=pick();if(!cur){$('question').textContent='조건에 맞는 문제가 없습니다.';$('choices').innerHTML='';return}recent.push(cur.id);if(recent.length>8)recent.shift();$('type').textContent=cur.type==='ox'?'⚡ 실전 O/X 판단형 · 맞으면 O, 틀리면 X':'📝 4지선다형 · 가장 적절한 답을 선택하세요';$('lvtag').textContent=cur.level==='green'?'그린':cur.level==='blue'?'블루':'공통';$('cattag').textContent=cur.cat;$('srctag').textContent=cur.src;$('question').textContent=cur.q;$('choices').innerHTML='';cur.c.forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="num">'+(i+1)+'</span><span>'+x+'</span>';b.onclick=()=>answer(i);$('choices').appendChild(b)});stats()}function answer(i){if(answered)return;answered=true;sess.s++;let ok=i===cur.a;ok?sess.c++:sess.w++;let h=hist[cur.id]||{ok:0,bad:0,domain:cur.domain};ok?h.ok++:h.bad++;h.domain=cur.domain;hist[cur.id]=h;daily[key()]=(daily[key()]||0)+1;save();[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===cur.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});$('feedback').className='feedback show '+(ok?'ok':'bad');$('result').textContent=ok?'✅ 정답입니다!':'❌ 오답입니다. 정답은 '+(cur.a+1)+'번입니다.';$('explain').textContent=cur.e;$('skip').style.display='none';$('next').style.display='block';stats();dashboard()}function stats(){$('solved').textContent=sess.s;$('correct').textContent=sess.c;$('wrong').textContent=sess.w;$('rate').textContent=sess.s?Math.round(sess.c/sess.s*100)+'%':'0%'}function restart(){sess={s:0,c:0,w:0};recent=[];$('quizArea').style.display='block';$('done').style.display='none';render()}function next(){let n=+$('size').value;if(n&&sess.s>=n){$('quizArea').style.display='none';$('done').style.display='block';$('doneText').textContent=`${sess.s}문제 중 ${sess.c}문제 정답 · 정답률 ${Math.round(sess.c/sess.s*100)}%`;return}render()}function start(exam=false){$('mode').value=exam?'pure':'weighted';$('qtype').value='mixed';$('size').value=exam?'20':'0';show('quiz');restart()}function summary(){let ok=0,bad=0,ai=0,data=0;Object.values(hist).forEach(h=>{ok+=h.ok||0;bad+=h.bad||0;let n=(h.ok||0)+(h.bad||0);if(h.domain==='ai')ai+=n;if(h.domain==='data')data+=n});let total=ok+bad;return{total,rate:total?Math.round(ok/total*100):0,ai,data}}function dashboard(){let s=summary(),g=Math.min(100,s.total),ap=Math.min(100,Math.round(s.ai/75*100)),dp=Math.min(100,Math.round(s.data/120*100));$('total').textContent=BANK.length;$('today').textContent=daily[key()]||0;$('allrate').textContent=s.rate+'%';$('ring').style.setProperty('--p',g);$('goal').textContent=g+'%';$('aip').textContent=ap+'%';$('datap').textContent=dp+'%';$('aibar').style.width=ap+'%';$('databar').style.width=dp+'%'}function renderWrong(){let a=Object.entries(hist).filter(([i,h])=>h.bad>0).sort((a,b)=>b[1].bad-a[1].bad),box=$('wrongList');box.innerHTML=a.length?'':'<p style="color:var(--muted)">아직 오답 기록이 없습니다.</p>';a.forEach(([id,h])=>{let q=BANK.find(x=>String(x.id)===id);if(!q)return;let d=document.createElement('div');d.className='wrongitem';d.innerHTML=`<b>${q.q}</b><p>정답: ${q.a+1}번 · ${q.c[q.a]}</p><p>${q.e}</p>`;box.appendChild(d)})}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start(true));$('randomStart').onclick=()=>start(false);$('wrongStart').onclick=()=>show('wrong');$('examStart').onclick=()=>start(true);$('skip').onclick=render;$('next').onclick=next;$('again').onclick=restart;['domain','level','qtype','mode','size'].forEach(x=>$(x).onchange=restart);dashboard();render();
</script></body></html>
